name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: find . -name "*.zip" -exec unzip -q -o {} \;
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: AppControl
      - uses: actions/upload-artifact@v4
        with:
          name: AppControl-APK
          path: AppControl/app/build/outputs/apk/debug/app-debug.apk
